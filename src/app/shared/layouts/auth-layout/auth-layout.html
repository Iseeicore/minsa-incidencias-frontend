<div class="flex min-h-screen flex-col bg-white lg:grid lg:grid-cols-3">
  <header class="px-6 py-6 lg:hidden">
    <app-brand />
  </header>

  <aside class="hidden bg-primary-50 lg:block">
    <div class="mx-auto mt-8 w-8/12 space-y-16">
      <app-brand />
      <ng-content select="[aside]" />
    </div>
  </aside>

  <main class="flex justify-center pb-10 lg:col-span-2">
    <div class="mx-auto mt-8 w-full max-w-md space-y-6 px-4 lg:mt-16 lg:px-0">
      <ng-content />
    </div>
  </main>
</div>
