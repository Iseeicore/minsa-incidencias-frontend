<div class="flex h-dvh overflow-hidden bg-gray-100">
  <app-sidebar
    [secciones]="secciones()"
    [nombre]="nombre()"
    [correo]="correo()"
    [compact]="!pantallaChica() && compact()"
    [drawer]="pantallaChica()"
    [abierto]="menuAbierto()"
    (cerrar)="cerrarSesion()"
    (ocultar)="cerrarMenu()"
    (navegado)="cerrarMenu()"
  />
  @if (pantallaChica() && menuAbierto()) {
    <div class="fixed inset-0 z-30 bg-gray-900/40" aria-hidden="true" (click)="cerrarMenu()"></div>
  }
  <div class="relative flex min-w-0 flex-1 flex-col overflow-x-hidden overflow-y-auto">
    <app-topbar [nombre]="nombre()" [compact]="compact()" [pantallaChica]="pantallaChica()" (alternar)="alternarMenu()">
      <app-avisos-campana avisos />
    </app-topbar>
    <main class="min-w-0 flex-1 px-4 pb-8 sm:px-6">
      <router-outlet />
    </main>
  </div>
</div>
