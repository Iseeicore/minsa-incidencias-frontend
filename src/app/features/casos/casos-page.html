<div class="space-y-6">
  <header class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-gray-600">Operación</p>
      <h1 class="text-3xl font-bold text-gray-900">Casos</h1>
    </div>
    <app-badge [tone]="BadgeTone.PRIMARY">Datos de demostración</app-badge>
  </header>

  <section aria-label="Filtros" class="flex flex-col gap-3 md:flex-row md:items-center">
    <app-search-input
      class="md:max-w-sm md:flex-1"
      label="Buscar caso"
      placeholder="Buscar caso..."
      [(value)]="texto"
    />
    <app-select-field label="Filtrar por prioridad" [options]="prioridadOpciones" [(value)]="prioridad" />
    <app-select-field label="Filtrar por estado" [options]="estadoOpciones" [(value)]="estado" />
  </section>

  <div class="max-w-full overflow-x-auto">
    <app-tabs label="Tipo de caso" [options]="tabsOpciones" [(value)]="tab" />
  </div>

  <app-card>
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="text-base font-bold text-gray-900">Listado</h2>
      <p class="text-sm font-medium text-gray-600" aria-live="polite">{{ casos().length }} casos</p>
    </div>

    @if (casos().length > 0) {
      <app-casos-tabla [casos]="casos()" />
    } @else {
      <div class="flex flex-col items-center gap-3 py-10 text-center">
        <p class="text-sm font-medium text-gray-700">No hay casos con estos filtros.</p>
        @if (hayFiltros()) {
          <app-button [variant]="ButtonVariant.OUTLINE" [tone]="ButtonTone.NEUTRAL" [size]="ButtonSize.SM" (click)="limpiar()">
            Limpiar filtros
          </app-button>
        }
      </div>
    }
  </app-card>
</div>
