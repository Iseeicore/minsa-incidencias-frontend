<div class="space-y-6">
  <header class="flex flex-wrap items-end justify-between gap-3">
    <div>
      <p class="text-sm font-medium text-gray-600">Operación</p>
      <h1 class="text-3xl font-bold text-gray-900">Mis bandejas</h1>
    </div>
    <app-badge [tone]="BadgeTone.PRIMARY">Datos de demostración</app-badge>
  </header>

  <app-tabs label="Bandeja" [options]="opciones()" [(value)]="tab" />

  <app-card>
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 class="text-base font-bold text-gray-900">{{ titulo() }}</h2>
      <p class="text-sm font-medium text-gray-600" aria-live="polite">{{ casos().length }} casos</p>
    </div>

    @if (casos().length > 0) {
      <app-casos-tabla [casos]="casos()" [descripcion]="'Casos de la bandeja ' + titulo()" />
    } @else {
      <p class="py-10 text-center text-sm font-medium text-gray-700">No hay casos en esta bandeja.</p>
    }
  </app-card>
</div>
